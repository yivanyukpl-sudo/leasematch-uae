le": "Deal assistant", "text": "Once approved, the assistant guides every step: terms, package, photo inspection, signatures, payment and keys.", "tip": "Review the landlord's terms", "screen": "<div class=\"s-head\"><b>Lease</b><span>Deal assistant</span></div><div class=\"s-body\"><div class=\"s-steps\"><span class=\"d\">✓ Approved</span><span class=\"c\">Terms</span><span>Package</span><span>Inspection</span><span>Sign</span><span>Pay</span></div><div class=\"s-bubble ai\">The landlord proposed: from 1 Dec, 12 months, deposit AED 4,250, 4 cheques, utilities paid by you.</div><div class=\"s-btn\" data-hot=\"Tap\">Review terms</div></div><div class=\"s-nav\"><div class=\"\"><span>🏠</span>Home</div><div class=\"\"><span>🔎</span>Search</div><div class=\"on\"><span>📄</span>Deals</div><div class=\"\"><span>👤</span>Profile</div></div>"}, {"title": "Package: AED 99, 149 or combo 199", "text": "Contract — AED 99, Protected payment — AED 149, Combo — AED 199. Even if you go to the landlord directly, a contract and a lawyer cost more, so leaving the app doesn't save money, and here we guarantee the contract and an honest payment.", "tip": "Choose “Combo”", "screen": "<div class=\"s-head\"><b>LeaseMatch package</b><span></span></div><div class=\"s-body\"><div class=\"s-card\"><b>Contract, done right</b><div class=\"s-price\">AED 99</div><div class=\"s-muted\">Template, e-signature, condition report</div></div><div class=\"s-card\"><b>Protected payment</b><div class=\"s-price\">AED 149</div><div class=\"s-muted\">Protected checkout, keys after payment</div></div><div class=\"s-card\" data-hot=\"Choose\" style=\"border-color:var(--gold-b)\"><span class=\"s-chip gold\">Best value</span><b style=\"display:block;margin-top:4px\">Combo</b><div class=\"s-price\">AED 199 <span class=\"s-strike\">248</span></div></div><div class=\"s-muted\">Why not go direct? A contract and lawyer cost more anyway.</div></div>"}, {"title": "AI photo inspection", "text": "The assistant walks you room
