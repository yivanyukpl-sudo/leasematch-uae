<script>window.SIM={"lang": "en", "scenes": [{"title": "Sign up as a tenant", "text": "Pick “I'm looking for a home”. Search and the AI agent are free for tenants, with no agency fee.", "tip": "Tap “Looking for a home”", "screen": "<div class=\"s-head\"><b>LeaseMatch</b><span>Sign up</span></div><div class=\"s-body\"><p class=\"s-title\">Who are you?</p><div class=\"s-card\" data-hot=\"Tap\"><b>🏠 Looking for a home</b><div class=\"s-muted\">Tenant · no agency fee</div></div><div class=\"s-card\"><b>🔑 Renting out a home</b><div class=\"s-muted\">Landlord</div></div><div class=\"s-card\"><b>🏢 Agent / broker</b><div class=\"s-muted\">Commission paid by the landlord</div></div></div>"}, {"title": "Your preferences", "text": "Area, annual budget in AED, bedrooms, furnished, number of cheques. The agent uses these for your match score.", "tip": "Tap “Save”", "screen": "<div class=\"s-head\"><b>Preferences</b><span></span></div><div class=\"s-body\"><div class=\"s-input filled\">Dubai · Dubai Marina, JLT</div><div class=\"s-input filled\">Up to AED 110,000 / year · 4 cheques</div><div class=\"s-row\"><span class=\"s-chip gold\">1 bedroom</span><span class=\"s-chip gold\">Furnished</span><span class=\"s-chip\">Near the metro</span></div><div class=\"s-btn\" data-hot=\"Tap\">Save</div></div><div class=\"s-nav\"><div class=\"\"><span>🏠</span>Home</div><div class=\"\"><span>🔎</span>Search</div><div class=\"\"><span>📄</span>Deals</div><div class=\"on\"><span>👤</span>Profile</div></div>"}, {"title": "Listings with a match score", "text": "Only verified landlords. The score shows how well each home fits you.", "tip": "Open the first listing", "screen": "<div class=\"s-head\"><b>Listings</b><span>3 homes</span></div><div class=\"s-body\"><div class=\"s-card\" data-hot=\"Open\"><div class=\"s-img\"></div><div class=\"s-between\" style=\"margin-top:8px\"><b>1BR in JLT, Cluster D</b><span class=\"s-chip ok\">91%</span></div><div class=\"s-muted\">AED 85,000/year · verified landlord · \">248</span></div></div><div class=\"s-muted\">Why not go direct? A contract and lawyer cost more anyway.</div></div>"}, {"title": "AI photo inspection", "text": "The assistant walks you room by room and says what to shoot. The AI rates each photo and flags damp, cracks, dirty AC filters.", "tip": "Photograph the bathroom", "screen": "<div class=\"s-head\"><b>Photo inspection</b><span>Step 3 of 7</span></div><div class=\"s-body\"><div class=\"s-steps\"><span class=\"d\">✓ Entrance</span><span class=\"d\">✓ Kitchen</span><span class=\"c\">Bathrooms</span><span>Rooms</span><span>Windows</span><span>AC</span></div><p class=\"s-title\">🛁 Bathrooms</p><div class=\"s-muted\">☐ Wide shot ☐ Grout and ceiling corners ☐ Water heater ☐ Fittings</div><div class=\"s-card\" data-hot=\"Take photo\" style=\"text-align:center\"><div style=\"font-size:30px\">📷</div><b>Take a photo</b></div></div>"}, {"title": "The AI warns you", "text": "The AI spotted possible mould in a ceiling corner. Raise it with the landlord before signing, in the deal chat.", "tip": "Tap “Discuss with landlord”", "screen": "<div class=\"s-head\"><b>Photo inspection</b><span>Result</span></div><div class=\"s-body\"><div class=\"s-card\" style=\"background:var(--bad-soft)\"><b style=\"color:var(--bad)\">Important: possible mould in a ceiling corner</b><div class=\"s-muted\">Sign of damp and weak ventilation.</div></div><div class=\"s-card\"><b>Minor: discoloured grout</b><div class=\"s-muted\">Note it in the condition report.</div></div><div class=\"s-btn\" data-hot=\"Tap\">Discuss with landlord</div></div>"}, {"title": "Sign the contract", "text": "Review the contract built from your terms and sign with your full name. The landlord signs too; order doesn't matter.", "tip": "Sign the contract", "screen": "<div class=\"s-head\"><b>Lease</b><span>Step 3</span></div><div class=\"s-steps\"><span class=\"d\">✓ Terms</span><span class=\"d\">✓ Package</span><span class=\"c\">Sign</span><span class=\"\">Proof of payment</span><span class=\"\">Proof of receipt</span><span class=\"\">Concluded</span><span class=\"\">Keys</span></div><div class=\"s-body\"><div class=\"s-card\"><b>Residential tenancy contract</b><div class=\"s-muted\">1. 12 months from 1 Dec 2026<br>2. AED 85,000/year in 4 cheques<br>3. Deposit AED 4,250<br>4. Ready for Ejari</div></div><div class=\"s-input filled\">Priya Raman</div><div class=\"s-btn\" data-hot=\"Tap\">Sign contract</div></div>"}, {"title": "Pay and attach proof of payment", "text": "Pay the first cheque, AED 21,250, then attach the confirmation: a bank transfer receipt, a photo of the cheque or a screenshot (PDF, JPG or PNG).", "tip": "Tap “Attach confirmation”", "screen": "<div class=\"s-head\"><b>Lease</b><span>Step 4</span></div><div class=\"s-steps\"><span class=\"d\">✓ Terms</span><span class=\"d\">✓ Package</span><span class=\"d\">✓ Sign</span><span class=\"c\">Proof of payment</span><span class=\"\">Proof of receipt</span><span class=\"\">Concluded</span><span class=\"\">Keys</span></div><div class=\"s-body\"><div class=\"s-card\" style=\"background:var(--gold-soft,#f4ebdb);font-size:12px\">💡 <b>Tip:</b> Pay the first cheque and attach the confirmation. The landlord sees it straight away.</div><div class=\"s-input filled\">Amount: AED 21,250</div><div class=\"s-input filled\">Reference: TRX 48211</div><div class=\"s-input filled\">📎 transfer-receipt.pdf</div><div class=\"s-btn\" data-hot=\"Tap\">Attach confirmation</div></div>"}, {"title": "Landlord confirms receipt", "text": "The landlord checks the money arrived and attaches their proof of receipt. Both of you can open both files.", "tip": "Next", "screen": "<div class=\"s-head\"><b>Lease</b><span>Step 5</span></div><div class=\"s-steps\"><span class=\"d\">✓ Terms</span><span class=\"d\">✓ Package</span><span class=\"d\">✓ Sign</span><span class=\"d\">✓ Proof of payment</span><span class=\"c\">Proof of receipt</span><span class=\"\">Concluded</span><span class=\"\">Keys</span></div><div class=\"s-body\"><div class=\"s-card\"><div class=\"s-between\"><b>🧾 Proof of payment</b><span class=\"s-chip ok\">✓ attached</span></div><div class=\"s-muted\">AED 21,250 · TRX 48211 · by you · Open file</div></div><div class=\"s-card\"><b>⏳ Waiting for the landlord</b><div class=\"s-muted\">Proof of receipt: bank statement line or receipt</div></div><div class=\"s-btn\" data-hot=\"Tap\">Next</div></div>"}, {"title": "Agreement concluded automatically", "text": "As soon as both confirmations are attached, LeaseMatch concludes the agreement by itself: the property is marked as leased and the signed contract appears. Nobody presses a button.", "tip": "Choose how to receive the keys", "screen": "<div class=\"s-head\"><b>Lease</b><span>Concluded</span></div><div class=\"s-steps\"><span class=\"d\">✓ Terms</span><span class=\"d\">✓ Package</span><span class=\"d\">✓ Sign</span><span class=\"d\">✓ Proof of payment</span><span class=\"d\">✓ Proof of receipt</span><span class=\"d\">✓ Concluded</span><span class=\"c\">Keys</span></div><div class=\"s-body\"><div class=\"s-card\"><div class=\"s-between\"><b>🧾 Proof of payment</b><span class=\"s-chip ok\">✓ attached</span></div><div class=\"s-muted\">AED 21,250 · TRX 48211 · by you · Open file</div></div><div class=\"s-card\"><div class=\"s-between\"><b>🧾 Proof of receipt</b><span class=\"s-chip ok\">✓ attached</span></div><div class=\"s-muted\">AED 21,250 · Statement ref 0931 · by Rashid · Open file</div></div><div class=\"s-card\" style=\"background:var(--ok-soft)\"><b style=\"color:var(--ok)\">✓ Concluded automatically</b><div class=\"s-muted\">Both confirmations attached · 28 Nov 2026, 14:02</div></div><div class=\"s-btn\" data-hot=\"Tap\">🔑 Choose how to receive the keys</div></div>"}, {"title": "Key handover window", "text": "A separate window: in hand at a meeting with the landlord (pick date, time and place: the apartment or another location) or by mail to an address you give.", "tip": "Tap “Send to landlord”", "screen": ontract", "screen": "<div class=\"s-head\"><b>Leases</b><span>Full history</span></div><div class=\"s-body\"><div class=\"s-row\"><span class=\"s-chip ok\">Active 1</span><span class=\"s-chip\">In progress 0</span><span class=\"s-chip\">Finished 2</span></div><p class=\"s-title\">Active leases</p><div class=\"s-card\"><b>1BR in JLT, Cluster D</b><div class=\"s-muted\">Landlord: Rashid · 1 Dec 2026 → 30 Nov 2027 · keys received</div></div><p class=\"s-title\">Finished leases</p><div class=\"s-card\"><b>Studio, Al Barsha</b><div class=\"s-muted\">Nov 2024 → Oct 2025 · ended</div></div><div class=\"s-card\"><b>1BR, Business Bay</b><div class=\"s-muted\">Nov 2023 → Oct 2024 · ended</div></div><div class=\"s-btn\" data-hot=\"Tap\">Open the signed contract</div></div>"}]};</script>
