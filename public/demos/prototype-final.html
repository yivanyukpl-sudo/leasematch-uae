<!doctype html>
<title>LeaseMatch</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F5F4F9;
    --surface:#FFFFFF;
    --surface-2:#F0EEF6;
    --ink:#131A2C;
    --ink-muted:#5B5F72;
    --ink-faint:#8B8FA0;
    --line:#E1DEEA;
    --line-strong:#CBC7DA;
    --accent:#0E2A4D;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7EAF2;
    --accent-soft-ink:#0E2A4D;
    --gold:#A8792F;
    --gold-soft:#F3E9D6;
    --good:#2F7D4F;
    --good-soft:#E4F1E7;
    --warn:#B4791C;
    --warn-soft:#FBEEDA;
    --critical:#B23A34;
    --critical-soft:#F8E4E2;
    --shadow: 0 1px 2px rgba(19,26,44,.04), 0 6px 20px -8px rgba(19,26,44,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1219; --surface:#171A24; --surface-2:#1B1F2B;
      --ink:#EAEAF2; --ink-muted:#9EA1B4; --ink-faint:#686C80;
      --line:#2A2E3C; --line-strong:#383D4E;
      --accent:#7C9BD4; --accent-ink:#0B1220; --accent-soft:#1E2A42; --accent-soft-ink:#9DB6E4;
      --gold:#D4AC63; --gold-soft:#332A18;
      --good:#6FBF8B; --good-soft:#1B2F22;
      --warn:#E0A94C; --warn-soft:#332811;
      --critical:#E38F89; --critical-soft:#33201E;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1219; --surface:#171A24; --surface-2:#1B1F2B;
    --ink:#EAEAF2; --ink-muted:#9EA1B4; --ink-faint:#686C80;
    --line:#2A2E3C; --line-strong:#383D4E;
    --accent:#7C9BD4; --accent-ink:#0B1220; --accent-soft:#1E2A42; --accent-soft-ink:#9DB6E4;
    --gold:#D4AC63; --gold-soft:#332A18;
    --good:#6FBF8B; --good-soft:#1B2F22;
    --warn:#E0A94C; --warn-soft:#332811;
    --critical:#E38F89; --critical-soft:#33201E;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px -8px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  a{color:inherit;}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  /* ---------- shell ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:12px 20px;
    background:var(--surface); border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:11px; cursor:pointer; }
  .brand .mark{
    width:32px; height:32px; border:2px solid var(--ink); border-radius:3px;
    position:relative; flex:none; overflow:hidden;
  }
  .brand .mark::before{ content:""; position:absolute; inset:0 50% 0 0; background:var(--accent); }
  .brand .mark::after{ content:""; position:absolute; inset:0 0 0 50%; background:var(--gold); }
  .brand .mark span{
    position:relative; z-index:1; display:flex; align-items:center; justify-content:center;
    height:100%; font-family:'Fraunces', serif; font-weight:600; font-size:15px; color:#fff;
    letter-spacing:-0.03em;
  }
  .brand .word{ display:flex; flex-direction:column; line-height:1; }
  .brand .wordmark{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; letter-spacing:-0.01em; }
  .brand .wordmark .lease{ color:var(--accent); }
  .brand .wordmark .match{ color:var(--gold); }
  .brand .tagline{ font-family:'IBM Plex Sans'; font-weight:500; font-size:9.5px; color:var(--ink-faint); letter-spacing:.12em; text-transform:uppercase; margin-top:3px; }

  .mode-switch{ display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; }
  .mode-switch button{
    border:none; background:transparent; color:var(--ink-muted);
    padding:7px 14px; border-radius:8px; font-weight:600; font-size:13.5px;
    transition: background .15s, color .15s;
  }
  .mode-switch button.active{ background:var(--accent); color:var(--accent-ink); }

  .topbar-right{ display:flex; align-items:center; gap:10px; }
  .demo-tag{
    font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-faint); border:1px solid var(--line); border-radius:6px; padding:4px 8px;
    white-space:nowrap;
  }

  .shell{ display:flex; min-height:calc(100vh - 53px); }

  /* ---------- provider sidebar ---------- */
  .sidebar{
    width:216px; flex:none; border-right:1px solid var(--line); background:var(--surface);
    padding:18px 12px; display:flex; flex-direction:column; gap:2px;
  }
  .sidebar .navlabel{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600; padding:8px 10px 6px; }
  .sidebar button{
    display:flex; align-items:center; gap:10px; text-align:left; width:100%;
    border:none; background:transparent; color:var(--ink-muted);
    padding:9px 10px; border-radius:8px; font-weight:500; font-size:14px;
  }
  .sidebar button.active{ background:var(--accent-soft); color:var(--accent-soft-ink); font-weight:600; }
  .sidebar button:hover:not(.active){ background:var(--surface-2); }
  .sidebar .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex:none; }
  .role-chip{
    margin:4px 10px 14px; padding:9px 10px; border-radius:9px; background:var(--gold-soft); color:var(--gold);
    font-size:11.5px; font-weight:600; line-height:1.4;
  }
  .role-chip .fee{ display:block; font-weight:500; opacity:.85; margin-top:2px; }

  main{ flex:1; min-width:0; padding:28px 32px 64px; max-width:1180px; }
  .applicant-main{ max-width:960px; margin:0 auto; padding:32px 24px 72px; }
  .narrow-main{ max-width:640px; margin:0 auto; padding:32px 24px 72px; }

  /* ---------- generic bits ---------- */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin-bottom:28px; }
  .kpi{ background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow); }
  .kpi .label{ font-size:12px; color:var(--ink-muted); font-weight:500; margin-bottom:8px; }
  .kpi .value{ font-family:'IBM Plex Mono'; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .kpi .delta{ font-size:12px; margin-top:6px; font-weight:600; }
  .kpi .delta.good{ color:var(--good); } .kpi .delta.warn{ color:var(--warn); }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .section-head h2{ font-size:20px; font-weight:600; }
  .section-head .sub{ color:var(--ink-muted); font-size:13.5px; }

  table{ width:100%; border-collapse:collapse; background:var(--surface); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
  thead th{ text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); font-weight:600; padding:11px 14px; border-bottom:1px solid var(--line); background:var(--surface-2); }
  tbody td{ padding:13px 14px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr{ cursor:pointer; transition:background .12s; }
  tbody tr:hover{ background:var(--surface-2); }
  .table-wrap{ overflow-x:auto; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:12px; font-weight:600; white-space:nowrap; }
  .pill.vacant{ background:var(--critical-soft); color:var(--critical); }
  .pill.occupied{ background:var(--good-soft); color:var(--good); }
  .pill.offer{ background:var(--warn-soft); color:var(--warn); }
  .pill.verified{ background:var(--gold-soft); color:var(--gold); }
  .pill.accepted{ background:var(--good-soft); color:var(--good); }
  .pill.declined{ background:var(--critical-soft); color:var(--critical); }
  .pill.review{ background:var(--warn-soft); color:var(--warn); }
  .pill.clarify{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .pill.pending{ background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--line); }

  .btn{ border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); padding:8px 14px; border-radius:9px; font-weight:600; font-size:13.5px; transition:background .12s,border-color .12s; }
  .btn:hover{ background:var(--surface-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.ghost{ border-color:transparent; background:transparent; }
  .btn.ghost:hover{ background:var(--surface-2); }
  .btn.sm{ padding:6px 11px; font-size:12.5px; border-radius:7px; }
  .btn.lg{ padding:12px 20px; font-size:15px; border-radius:11px; }
  .btn.danger{ color:var(--critical); }
  .btn:disabled{ opacity:.45; cursor:default; }
  .btn.block{ width:100%; }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }

  /* ---------- forms ---------- */
  .form-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:16px; padding:22px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-muted); margin-bottom:6px; }
  .field select, .field input, .field textarea{
    width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:14px;
  }
  .field textarea{ resize:vertical; min-height:80px; }
  .field.span2{ grid-column:span 2; }
  .form-actions{ padding:0 22px 22px; display:flex; justify-content:flex-end; gap:10px; }
  .field-eyebrow{ font-size:11.5px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; display:block; }

  .step-section{ margin-bottom:26px; }
  .step-section .sh{ display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .step-section .sh .bar{ width:3px; height:16px; background:var(--gold); border-radius:2px; }
  .step-section .sh h3{ font-size:15.5px; font-weight:600; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-muted);
    padding:8px 14px; border-radius:9px; font-weight:600; font-size:13px; transition:.12s;
  }
  .chip.on{ background:var(--gold); border-color:var(--gold); color:#fff; }
  .chip.rm{ display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border-color:var(--accent); }

  .toggle-row{ display:flex; gap:0; border:1px solid var(--line-strong); border-radius:9px; overflow:hidden; width:fit-content; }
  .toggle-row button{ border:none; background:var(--surface-2); color:var(--ink-muted); padding:9px 18px; font-weight:600; font-size:13.5px; }
  .toggle-row button.on{ background:var(--ink); color:var(--bg); }

  .stepper-count{ display:flex; align-items:center; gap:16px; }
  .stepper-count button{ width:34px; height:34px; border-radius:8px; border:1px solid var(--line-strong); background:var(--surface); font-size:17px; font-weight:600; }
  .stepper-count .n{ font-family:'IBM Plex Mono'; font-size:18px; font-weight:600; min-width:20px; text-align:center; }

  .provider-pref{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .provider-pref button{
    border:1px solid var(--line-strong); background:var(--surface); border-radius:11px; padding:16px 12px; text-align:left;
    font-weight:600; font-size:13.5px; color:var(--ink-muted);
  }
  .provider-pref button.on{ border-color:var(--gold); background:var(--gold-soft); color:var(--ink); }
  .provider-pref button .icon{ font-size:18px; margin-bottom:6px; display:block; }

  .check-inline{ display:flex; align-items:flex-start; gap:9px; font-size:13px; color:var(--ink-muted); }
  .check-inline input{ margin-top:3px; }

  .dropzone{
    border:1.5px dashed var(--line-strong); border-radius:12px; padding:26px; text-align:center;
    background:var(--surface-2); cursor:pointer; transition:.12s;
  }
  .dropzone:hover{ border-color:var(--gold); }
  .dropzone.filled{ border-style:solid; border-color:var(--good); background:var(--good-soft); }
  .dropzone .dz-icon{ font-size:24px; margin-bottom:8px; }
  .dropzone .dz-label{ font-weight:600; font-size:14px; }
  .dropzone .dz-sub{ font-size:12px; color:var(--ink-muted); margin-top:3px; }

  .sig-pad{
    border:1.5px dashed var(--line-strong); border-radius:12px; height:100px; position:relative;
    background:repeating-linear-gradient(var(--surface-2),var(--surface-2) 99%, var(--line) 100%);
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.12s;
  }
  .sig-pad.signed{ border-style:solid; border-color:var(--gold); }
  .sig-pad .sig-hint{ color:var(--ink-faint); font-size:13px; }
  .sig-pad .sig-mark{ font-family:'Fraunces'; font-style:italic; font-size:26px; color:var(--gold); }

  .stepper{ display:flex; gap:8px; margin-bottom:22px; }
  .stepper .step{ flex:1; height:4px; border-radius:99px; background:var(--line); }
  .stepper .step.done{ background:var(--accent); }
  .step-label{ font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold); margin-bottom:4px; }

  /* ---------- listings ---------- */
  .hero{ margin-bottom:26px; }
  .hero h1{ font-size:32px; margin-bottom:8px; }
  .hero p{ color:var(--ink-muted); font-size:15px; max-width:52ch; }

  .listings-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; margin-top:18px; }
  .listing-card{ overflow:hidden; cursor:pointer; transition:transform .14s, box-shadow .14s; }
  .listing-card:hover{ transform:translateY(-2px); box-shadow:0 2px 4px rgba(19,26,44,.06), 0 14px 28px -10px rgba(19,26,44,.22); }
  .listing-photo{ height:140px; position:relative; }
  .listing-photo .price-tag{
    position:absolute; bottom:10px; left:10px; background:rgba(19,26,44,.78); color:#fff;
    padding:5px 10px; border-radius:8px; font-family:'IBM Plex Mono'; font-size:13px; font-weight:600;
  }
  .match-badge{
    position:absolute; top:10px; right:10px; background:var(--gold); color:#fff;
    padding:4px 9px; border-radius:99px; font-family:'IBM Plex Mono'; font-size:11.5px; font-weight:600;
  }
  .listing-body{ padding:14px 16px 16px; }
  .listing-body h3{ font-size:16px; font-weight:600; margin-bottom:3px; }
  .listing-loc{ color:var(--ink-muted); font-size:13px; margin-bottom:10px; }
  .listing-specs{ display:flex; gap:10px; font-size:12.5px; color:var(--ink-muted); }

  .detail-photo{ height:260px; border-radius:14px; margin-bottom:20px; }
  .detail-grid{ display:grid; grid-template-columns:1.6fr 1fr; gap:28px; align-items:start; }
  .amenity-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .amenity-list span{ background:var(--surface-2); border:1px solid var(--line); border-radius:99px; padding:5px 11px; font-size:12.5px; color:var(--ink-muted); }
  .price-box{ padding:20px; }
  .price-box .amt{ font-family:'IBM Plex Mono'; font-size:28px; font-weight:600; }
  .price-box .per{ color:var(--ink-muted); font-size:13px; margin-top:2px; }

  .check-row{ display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border:1px solid var(--line); border-radius:11px; margin-bottom:10px; background:var(--surface); }
  .check-row .cr-label{ font-weight:600; font-size:14px; }
  .check-row .cr-sub{ font-size:12.5px; color:var(--ink-muted); margin-top:2px; }

  .app-list-item{ display:flex; gap:14px; padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:12px; align-items:center; flex-wrap:wrap; }
  .app-thumb{ width:56px; height:56px; border-radius:9px; flex:none; }
  .app-info{ flex:1; min-width:160px; }
  .app-info h4{ font-family:'IBM Plex Sans'; font-size:14.5px; font-weight:600; margin:0 0 2px; }
  .app-info .meta{ font-size:12.5px; color:var(--ink-muted); }
  .app-actions{ display:flex; align-items:center; gap:8px; }

  .applicant-card{ display:flex; gap:14px; padding:16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:12px; }
  .avatar{ width:44px; height:44px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Fraunces'; font-size:16px; color:#fff; background:linear-gradient(155deg, var(--accent), var(--gold)); }
  .applicant-info{ flex:1; min-width:0; }
  .applicant-info .name-row{ display:flex; align-items:center; gap:8px; margin-bottom:3px; flex-wrap:wrap; }
  .applicant-info .name-row h4{ font-family:'IBM Plex Sans'; font-size:15px; font-weight:600; }
  .applicant-facts{ display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-muted); margin-top:6px; }
  .applicant-actions{ display:flex; gap:8px; flex:none; align-self:center; }

  .empty{ text-align:center; padding:48px 20px; color:var(--ink-muted); }
  .empty .glyph{ font-size:28px; margin-bottom:10px; }

  .breadcrumb{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-muted); margin-bottom:16px; }
  .breadcrumb button{ background:none; border:none; color:var(--accent); font-weight:600; padding:0; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(12px);
    background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:10px;
    font-size:13.5px; font-weight:500; box-shadow:0 10px 30px -8px rgba(0,0,0,.4);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- notifications ---------- */
  .notif-row{ display:flex; gap:12px; padding:14px 16px; border:1px solid var(--line); border-radius:12px; background:var(--surface); margin-bottom:10px; }
  .notif-dot{ width:8px; height:8px; border-radius:50%; background:var(--gold); margin-top:6px; flex:none; }
  .notif-dot.read{ background:var(--line-strong); }
  .notif-row .body{ flex:1; }
  .notif-row .txt{ font-size:14px; }
  .notif-row .time{ font-size:12px; color:var(--ink-faint); margin-top:3px; }

  /* ---------- lease flow ---------- */
  .lease-summary-row{ display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .lease-summary-row:last-child{ border-bottom:none; }
  .lease-summary-row .k{ color:var(--ink-muted); }
  .lease-summary-row .v{ font-weight:600; font-family:'IBM Plex Mono'; }

  .progress-bar{ height:8px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress-bar .fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--accent)); border-radius:99px; transition:width .5s ease; }

  /* ---------- auth / landing ---------- */
  .auth-wrap{ min-height:calc(100vh - 53px); display:flex; align-items:center; justify-content:center; padding:40px 20px; }
  .landing-wrap{ min-height:calc(100vh - 53px); display:flex; flex-direction:column; align-items:center; padding:56px 20px 40px; text-align:center; }
  .landing-hero{
    width:100%; max-width:640px; height:280px; border-radius:20px; position:relative; overflow:hidden;
    background:linear-gradient(155deg, var(--accent) 0%, #1c3d66 55%, var(--gold) 130%);
    display:flex; align-items:flex-end; padding:20px; margin-bottom:36px;
  }
  .landing-hero .badge{
    background:rgba(255,255,255,.94); color:var(--ink); border-radius:11px; padding:10px 14px; text-align:left;
    font-size:12.5px; max-width:260px; box-shadow:var(--shadow);
  }
  .landing-hero .badge .tag{ color:var(--gold); font-weight:700; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; display:block; margin-bottom:3px; }
  .landing-wrap h1{ font-size:34px; max-width:20ch; margin-bottom:10px; }
  .landing-wrap h1 em{ color:var(--gold); font-style:italic; }

    list.push({
      id: propertyId+'-a'+i,
      name: applicantNames[idx],
      occupation: occupations[idx],
      income: incomeBand,
      verified: (i % 3 !== 0),
      moveIn: ['This month','Within 2 weeks','Next month','Flexible'][(seedOffset+i)%4],
      status: 'pending',
      propertyId

function scoreProperty(p, pr){
  let score = 0;
  score += (!p.propertyTypes.length || p.propertyTypes.includes(pr.type)) ? 35 : 5;
  score += (!p.locations.length || p.locations.includes(pr.loc)) ? 35 : 5;
  if(!p.budget) score += 30;
  else { const b = Number(p.budget); if(pr.price<=b) score += 30; else if(pr.price<=b*1.25) score += 16; else score += 4; }
  return Math.min(99, score);
}
function matchFromProfile(p){
  // Always returns every live listing, ranked by fit — a real matching engine narrows the same way
  // but a demo should never dead-end into "no matches" just because a chip combo is narrow.
  return properties.map(pr=>({...pr, matchScore: scoreProperty(p,pr)})).sort((a,b)=>b.matchScore-a.matchScore);
}

function statusPill(status){
  const map = {
    pending:['pending','Under review'], review:['review','Documents under inspection'],
    clarify:['clarify','Clarification requested'], accepted:['accepted','Accepted'], declined:['declined','Declined'],
  };
  const [cls,label] = map[status] || map.pending;
  return `<span class="pill ${cls}">${label}</span>`;

function renderLeaseCta(propertyId, appId){
  const lease = leases[propertyId];
  if(!lease) return '';
  const info = leaseStageInfo[lease.stage];
  const tenantsTurn = lease.stage==='awaiting_signature' || lease.stage==='awaiting_payment' || lease.stage==='finalized';
  if(tenantsTurn) return `<button class="btn sm primary" data-lease="${appId}">${lease.stage==='finalized'?'View lease':(lease.stage==='awaiting_payment'?'Make payment':'Review & sign')}</button>`;
  return `<span class="pill pending">${info.tenantLabel}</span>`;
}

  return `
  <div class="breadcrumb"><button data-nav-provider="properties">&larr; All properties</button></div>
  <div class="section-head">
    <h2>${p.title}</h2>
    <span class="sub">${p.loc} &middot; ${money(p.price)}/yr &middot; vacant ${p.daysVacant} days</span>
  </div>
  ${list.length===0 ? emptyState('No applicants yet','As tenants apply, verified profiles will appear here for review.') :
  list.map(a=>`
    <div class="applicant-card">
      <div class="avatar">${a.name[0]}</div>
      <div class="applicant-info">
        <div class="name-row">
          <h4>${a.name}</h4>
          ${a.verified?'<span class="pill verified">&#9733; Verified</span>':'<span class="pill pending">Verification pending</span>'}
          ${statusPill(mapApplicantStatus(a.status))}
        </div>
        <div class="applicant-facts">
          <span>${a.occupation}</span>
          <span class="mono">${money(a.income)}/mo gross</span>
          <span>Move-in: ${a.moveIn}</span>
        </div>
      </div>
      <div class="applicant-actions">
        ${a.status==='pending' ? `
          <button class="btn sm primary" data-action="accept" data-aid="${a.id}">Accept</button>
          <button class="btn sm" data-action="clarify" data-aid="${a.id}">Clarify</button>
          <button class="btn sm danger" data-action="decline" data-aid="${a.id}">Decline</button>
        ` : `<button class="btn sm ghost" disabled>${cap(a.status)}</button>`}
      </div>
    </div>`).join('')}
  `;
}
function mapApplicantStatus(s){ return s==='pending' ? 'review' : s; }

function renderProviderLeases(){
  const entries = Object.keys(leases);
  if(entries.length===0) return `
    <div class="section-head"><h2>Leases</h2><span class="sub">Agreements and payments in progress</span></div>
    ${emptyState('No leases in progress yet','Accept an applicant from a property to start a lease agreement here.')}`;

  return `
  <div class="section-head"><h2>Leases</h2><span class="sub">Agreements and payments in progress</span></div>
  ${entries.map(pid=>{
    const p = properties.find(x=>x.id===pid);
    const lease = leases[pid];
    const info = leaseStageInfo[lease.stage];
    let action = '';
    if(info.providerAction==='draft') action = `<button class="btn sm primary" data-lease-action="draft" data-pid="${pid}">Create lease agreement</button>`;
    else if(info.providerAction==='finalize') action = `<button class="btn sm primary" data-lease-action="finalize" data-pid="${pid}">Review signature &amp; finalize</button>`;
    else if(info.providerAction==='confirm') action = `<button class="btn sm primary" data-lease-action="confirm" data-pid="${pid}">Confirm receipt of payment</button>`;
    else action = `<span class="pill pending">${info.providerLabel}</span>`;
    return `
    <div class="app-list-item">
      <div class="app-thumb" style="${PHOTO(properties.findIndex(x=>x.id===pid),56)}"></div>
      <div class="app-info">
        <h4>${p.title}</h4>
        <div class="meta">Tenant: ${lease.tenantName} &middot; ${p.loc} &middot; ${money(p.price)}/yr</div>
      </div>
      <div class="app-actions">${lease.stage==='finalized'?'<span class="pill accepted">Completed</span>':action}</div>
    </div>`;
  }).join('')}`;
}

function renderProviderTenantSearch(){
  return `
  <div class="section-head"><h2>Find tenant</h2><span class="sub">Search verified tenants actively looking, and send them a proposal</span></div>
  <div class="card">
    <div class="form-grid">
      <div class="field"><label>Max budget (AED/yr)</label><input id="ts-budget" type="number" placeholder="e.g. 100000"></div>
      <div class="field"><label>Preferred area</label><select id="ts-area"><option value="">Any</option>${areasList.map(a=>`<option>${a}</option>`).join('')}</select></div>
      <div class="field"><label>Move-in timeframe</label><select id="ts-move"><option value="">Any</option><option>This month</option><option>Within 2 weeks</option><option>Next month</option><option>Flexible</option></select></div>
    </div>
    <div class="form-actions"><button class="btn primary" id="tsSearchBtn">Search tenant profiles</button></div>
  </div>
  <div id="tsResults" style="margin-top:20px;"></div>`;
}

function renderProviderDocuments(){
  return `
  <div class="section-head"><h2>Documents</h2><span class="sub">Ownership proofs, licenses, and lease agreements on file</span></div>
  <div class="table-wrap"><table>
    <thead><tr><th>Document</th><th>Date</th><th>Status</th></tr></thead>
    <tbody>${providerDocuments.map(d=>`<tr><td>${d.name}</td><td class="mono">${d.date}</td><td><span class="pill ${d.status==='verified'?'verified':'pending'}">${cap(d.status)}</span></td></tr>`).join('')}</tbody>
  </table></div>`;
}

function renderProvider(){
  const v = state.provider.view;
  let body = '';
  if(v==='overview') body = renderProviderOverview();
  else if(v==='properties') body = renderProviderProperties();
  else if(v==='applicants') body = renderProviderApplicants();
  else if(v==='addProperty') body = renderProviderAddProperty();
  else if(v==='leases') body = renderProviderLeases();
  else if(v==='tenantSearch') body = renderProviderTenantSearch();
  else if(v==='documents') body = renderProviderDocuments();
  else if(v==='notifications') body = renderNotifications(state.provider.notifications);

  const rl = roleLabels[state.providerRole];
  return `
  <div class="sidebar">
    <div class="navlabel">Workspace</div>
    <div class="role-chip">${rl.name}<span class="fee">${rl.fee}</span></div>
    ${providerNav.map(n=>`<button data-nav-provider="${n.id}" class="${(v===n.id || (n.id==='properties'&&(v==='applicants'||v==='addProperty')))?'active':''}"><span class="dot"></span>${n.label}</button>`).join('')}
  </div>
  <main>${body}</main>`;
}

/* ================= render + events ================= */
function render(){
  const inApp = state.screen==='app';
  document.getElementById('modeSwitch').style.visibility = inApp ? 'visible' : 'hidden';
  document.querySelector('.topbar-right').style.visibility = inApp ? 'visible' : 'hidden';
  document.querySelectorAll('#modeSwitch button').forEach(b=>b.classList.toggle('active', b.dataset.mode===state.mode));

  const shell = document.getElementById('shell');
  if(state.screen==='landing') shell.innerHTML = renderLanding();
  else if(state.screen==='signup') shell.innerHTML = renderSignup();
  else if(state.screen==='otp') shell.innerHTML = renderOtp();
  else if(state.screen==='role') shell.innerHTML = renderRoleSelect();
  else {
    shell.innerHTML = state.mode==='applicant' ? `<main style="flex:1; padding:0;">${renderApplicant()}</main>` : renderProvider();
  }
  bindEvents();
}

function bindEvents(){
  const shell = document.getElementById('shell');
  const q = sel => shell.querySelector(sel);
  const qa = sel => shell.querySelectorAll(sel);

  /* ---- auth flow ---- */
  qa('[data-auth]').forEach(el=>el.addEventListener('click', ()=>{
    const a = el.dataset.auth;
    if(a==='signup'||a==='signin') state.screen='signup';
    else if(a==='otp') state.screen='otp';
    else if(a==='resend'){ toast('Verification code resent'); return; }
    else if(a==='role') state.screen='role';
    else if(a==='skip'){ state.screen='app'; }
    else if(a==='enter'){
      state.screen='app';
      state.mode = state.pendingRole==='tenant' ? 'applicant' : 'provider';
      if(state.pendingRole!=='tenant') state.providerRole = state.pendingRole;
      toast(`Welcome — signed in as ${roleDefs.find(r=>r.id===state.pendingRole).title}`);
    }
    render();
  }));
  qa('[data-role]').forEach(el=>el.addEventListener('click', ()=>{ state.pendingRole = el.dataset.role; render(); }));
  qa('.otp-digit').forEach((el,i,arr)=>el.addEventListener('input', ()=>{ if(el.value && arr[i+1]) arr[i+1].focus(); }));

  /* ---- applicant step 1 ---- */
  const prof = state.applicant.profile;
  qa('[data-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.toggle, val = el.dataset.val;
    const arr = prof[key];
    const i = arr.indexOf(val);
    if(i>-1) arr.splice(i,1); else arr.push(val);
    render();
  }));
  q('#f-sqft')?.addEventListener('input', e=>{ prof.sqft = e.target.value; });
  qa('[data-rooms]').forEach(el=>el.addEventListener('click', ()=>{
    prof.rooms = Math.max(0, prof.rooms + Number(el.dataset.rooms));
    render();
  }));
  qa('[data-furn]').forEach(el=>el.addEventListener('click', ()=>{ prof.furnishing = el.dataset.furn; render(); }));
  qa('[data-pref]').forEach(el=>el.addEventListener('click', ()=>{ prof.providerPref = el.dataset.pref; render(); }));
  qa('[data-renov]').forEach(el=>el.addEventListener('click', ()=>{ prof.renovation = el.dataset.renov; render(); }));
  qa('[data-renovh]').forEach(el=>el.addEventListener('click', ()=>{ prof.renovationHandling = el.dataset.renovh; render(); }));
  q('#consentChk')?.addEventListener('change', e=>{ prof.consent = e.target.checked; render(); });
  q('#step1Continue')?.addEventListener('click', ()=>{ state.applicant.view='step2'; render(); });

  /* ---- applicant step 2 ---- */
  qa('[data-lt]').forEach(el=>el.addEventListener('click', ()=>{ prof.leaseType = el.dataset.lt; render(); }));
  q('#f-budget2')?.addEventListener('input', e=>{ prof.budget = e.target.value; });
  qa('[data-imm]').forEach(el=>el.addEventListener('click', ()=>{ prof.immigration = el.dataset.imm; render(); }));
  qa('[data-occ]').forEach(el=>el.addEventListener('click', ()=>{ prof.occupation = el.dataset.occ; render(); }));
  q('#f-idnum')?.addEventListener('input', e=>{ prof.idNumber = e.target.value; });
  q('#idDropzone')?.addEventListener('click', ()=>{ prof.idUploaded = true; render(); toast('Document uploaded'); });
  q('#certChk')?.addEventListener('change', e=>{ prof.certified = e.target.checked; render(); });
  q('#sigPad')?.addEventListener('click', ()=>{ prof.signed = true; render(); });
  q('#submitProfile')?.addEventListener('click', ()=>{
    state.applicant.view = 'submitting';
    render();
    let pct = 0;
    const iv = setInterval(()=>{
      pct += 18 + Math.random()*10;
      if(pct>=100){ pct=100; clearInterval(iv);
        setTimeout(()=>{
          state.applicant.matches = matchFromProfile(prof);
          state.applicant.view = 'matches';
          render();
        }, 350);
      }
      const fill = document.getElementById('inspectFill'), pc = document.getElementById('inspectPct');
      if(fill){ fill.style.width = pct+'%'; pc.textContent = Math.round(pct)+'%'; }
    }, 260);
  });

  /* ---- applicant matches/detail ---- */
  qa('[data-open-listing]').forEach(el=>el.addEventListener('click', ()=>{
    state.applicant.selectedProperty = properties.find(p=>p.id===el.dataset.openListing);
    state.applicant.view = 'detail';
    render();
  }));
  q('#applyBtn')?.addEventListener('click', ()=>{
    const p = state.applicant.selectedProperty;
    const already = applicants.find(x=>x.propertyId===p.id && x.isYou);
    if(already){ state.applicant.view = 'confirm'; render(); toast('You already applied to this listing'); return; }
    const prof = state.applicant.profile;
    // This lands in the exact same applicants[] queue the provider reviews — switch to "I manage properties"
    // and open this property to see it appear, live.
    applicants.unshift({
      id:'you-'+p.id, name:'You', isYou:true,
      occupation: prof.occupation==='self' ? 'Self-employed' : 'Employed professional',
      income: Math.round(Number(prof.budget||60000)/3),
      verified:true, moveIn:'Flexible', status:'pending', propertyId:p.id,
    });
    state.applicant.view = 'confirm';
    render();
    toast('Application sent to '+p.provider);
  });

  qa('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{ state.applicant.view = el.dataset.nav; render(); }));

  /* ---- applicant lease flow ---- */
  qa('[data-lease]').forEach(el=>el.addEventListener('click', ()=>{
    state.applicant.leaseAppId = el.dataset.lease;
    state.applicant.view = 'lease';
    render();
  }));
  function currentLease(){
    const a = applicants.find(x=>x.id===state.applicant.leaseAppId);
    return a ? leases[a.propertyId] : null;
  }
  q('#agreeTerms')?.addEventListener('change', e=>{ const l=currentLease(); l.termsAgreed = e.target.checked; render(); });
  q('#leaseSig')?.addEventListener('click', ()=>{ const l=currentLease(); l.signed = true; render(); });
  q('#leaseSignSubmit')?.addEventListener('click', ()=>{
    const l = currentLease();
    l.stage = 'awaiting_finalize';
    render();
    toast('Signed agreement sent to provider for finalization');
  });
  q('#payNow')?.addEventListener('click', ()=>{
    const l = currentLease();
    l.paid = true; l.stage = 'awaiting_confirmation';
    render();
    toast('Payment sent — awaiting provider confirmation');
  });
  q('#payFinance')?.addEventListener('click', ()=>{ toast("You'll be redirected to our financing partner"); });
  q('#receiptDropzone')?.addEventListener('click', ()=>{
    const l = currentLease();
    l.receiptUploaded = true; l.stage = 'awaiting_confirmation';
    render();
    toast('Receipt uploaded — awaiting provider confirmation');
  });
  q('#downloadLease')?.addEventListener('click', ()=>{ toast('Downloading signed-lease-agreement.pdf'); });

  /* ---- provider: properties / applicants ---- */
  qa('[data-open-property]').forEach(el=>el.addEventListener('click', ()=>{
    state.provider.selectedProperty = properties.find(p=>p.id===el.dataset.openProperty);
    state.provider.view = 'applicants';
    render();
  }));
  qa('[data-nav-provider]').forEach(el=>el.addEventListener('click', ()=>{ state.provider.view = el.dataset.navProvider; render(); }));
  qa('[data-action]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const a = applicants.find(x=>x.id===el.dataset.aid);
    const action = el.dataset.action;
    a.status = action==='accept' ? 'accepted' : action==='decline' ? 'declined' : 'clarify';
    if(action==='accept'){ ensureLease(a.propertyId, a.name); }
    const label = action==='accept' ? 'Applicant accepted — lease flow started' : action==='decline' ? 'Applicant declined' : 'Clarification requested from applicant';
    toast(label);
    render();
  }));

  /* ---- provider: leases ---- */
  qa('[data-lease-action]').forEach(el=>el.addEventListener('click', ()=>{
    const lease = leases[el.dataset.pid];
    const action = el.dataset.leaseAction;
    if(action==='draft'){ lease.stage='awaiting_signature'; toast('Lease agreement drafted — sent to tenant'); }
    else if(action==='finalize'){ lease.stage='awaiting_payment'; toast('Agreement finalized — tenant notified to pay'); }
    else if(action==='confirm'){ lease.stage='finalized'; toast('Payment receipt confirmed — lease finalized'); }
    render();
  }));

  /* ---- provider: add property ---- */
  q('#ownDropzone')?.addEventListener('click', (e)=>{ e.currentTarget.classList.add('filled'); e.currentTarget.querySelector('.dz-label').textContent='title-deed.pdf uploaded'; toast('Document uploaded'); });
  q('#submitProperty')?.addEventListener('click', ()=>{
    const title = q('#np-title').value || 'New listing';
    const type = q('#np-type').value, loc = q('#np-loc').value;
    const price = Number(q('#np-price').value)||70000, beds = Number(q('#np-beds').value)||1;
    const baths = Number(q('#np-baths').value)||1, sqft = Number(q('#np-sqft').value)||700;
    const desc = q('#np-desc').value || 'New listing, description pending.';
    const providerName = roleLabels[state.providerRole].name;
    properties.push({
      id:'p'+(properties.length+1), title, loc, type, price, period:'yr', beds, baths, sqft,
      furnished:'unfurnished', provider:providerName, daysVacant:0,
      amenities:['Parking'], desc
    });
    toast('Property submitted for verification');
    state.provider.view = 'properties';
    render();
  });

  /* ---- provider: tenant search ---- */
  q('#tsSearchBtn')?.addEventListener('click', ()=>{
    const budget = Number(q('#ts-budget').value)||Infinity, area = q('#ts-area').value, move = q('#ts-move').value;
    const results = tenantSeekers.filter(t=> t.budget<=budget*1.15 && (!area||t.area===area) && (!move||t.moveIn===move) );
    const box = document.getElementById('tsResults');
    box.innerHTML = results.length===0 ? emptyState('No matching tenant profiles','Widen your budget or area to see more verified seekers.') :
      results.map(t=>`
        <div class="applicant-card">
          <div class="avatar">${t.name[0]}</div>
          <div class="applicant-info">
            <div class="name-row"><h4>${t.name}</h4>${t.verified?'<span class="pill verified">&#9733; Verified</span>':'<span class="pill pending">Verification pending</span>'}</div>
            <div class="applicant-facts"><span>${t.occupation}</span><span class="mono">Budget ${money(t.budget)}/yr</span><span>${t.area}</span><span>Move-in: ${t.moveIn}</span></div>
          </div>
          <div class="applicant-actions"><button class="btn sm primary" data-proposal="${t.id}">Send proposal</button></div>
        </div>`).join('');
    box.querySelectorAll('[data-proposal]').forEach(b=>b.addEventListener('click', ()=>{
      const t = tenantSeekers.find(x=>x.id===b.dataset.proposal);
      toast('Proposal sent to '+t.name);
    }));
  });
}

render();
</script>
